services:
  # 1. .NET 8 Backend API
  - type: web
    name: realestate-api
    runtime: docker
    dockerContext: backend/RealEstateApi
    dockerfilePath: Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: realestate-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Add Email Provider API Keys here in the Render Dashboard

  # 2. React PWA Frontend
  - type: web
    name: realestate-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: realestate-api
          property: url

databases:
  # 3. PostgreSQL Database
  - name: realestate-db
    databaseName: realestate
    plan: starter
